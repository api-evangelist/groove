apis:
- aid: groove:graphql-api
  name: Groove GraphQL API v2
  description: >-
    GraphQL API exposing conversations, messages, agents, contacts, mailboxes, tags, and knowledge base
    data through a single endpoint. Authentication uses a Bearer API key retrieved from Groove account
    settings. The GraphQL API is the actively developed replacement for the legacy v1 REST API.
  humanURL: https://developer.groovehq.com
  baseURL: https://api.groovehq.com/graphql
  tags:
  - GraphQL
  - Conversations
