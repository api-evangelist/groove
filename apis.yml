  - type: GitHub Documentation
    url: https://github.com/GrooveHQ/docs
  - url: graphql/groove-graphql.md
    type: GraphQL
- aid: groove:rest-api-v1
  name: Groove REST API v1
  description: >-
    Legacy REST API for managing customers, conversations, messages, mailboxes, agents, tags, and webhooks
    in Groove. Authentication uses a Bearer API key. The REST API is no longer actively developed; new
    integrations should target the GraphQL API.
  humanURL: https://doc.groovehq.com
  baseURL: https://api.groovehq.com/v1
  tags:
  - Customer Support
  - Conversations
  - Customers
  - Mailboxes
  - Webhooks
  properties:
  - type: Documentation
    url: https://doc.groovehq.com
- aid: groove:webhooks
  name: Groove Webhooks
  description: >-
    Groove's webhook surface delivered through the legacy REST API webhook subscription endpoint. Customers
    register destination URLs and event types via POST /v1/webhooks; Groove then POSTs JSON payloads for
    the fourteen documented events covering tickets, customers, agents, and messages.
  humanURL: https://doc.groovehq.com/webhooks
  baseURL: https://api.groovehq.com/v1/webhooks
  tags:
  - Webhooks
  - Events
  - Tickets
